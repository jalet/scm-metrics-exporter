{{- if .Values.rbac.create }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "scm-metrics-exporter.fullname" $ }}-manager
  namespace: {{ . }}
  labels:
    {{- include "scm-metrics-exporter.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "scm-metrics-exporter.fullname" $ }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "scm-metrics-exporter.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
